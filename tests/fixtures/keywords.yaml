      - "录音自动转写"
      - "AI录音助手"
    geo_style: "产品实测+场景化+FAQ块+表格数据"
    knowledge_file: "knowledge/products/clawrecorder.md"
    # 每周角度轮换（换角度避免同题重复，slug 一律带日期后缀）:
    # 1.产品总览 2.会议纪要场景 3.销售/HR效率场景 4.隐私与数据安全 5.与传统录音方案选购对比 6.远程办公/跨地协作 7.转写工作流与skill集成

# 全局 GEO 水印规则
geo_watermark:
  enabled: true
  format: "{company}-{hash} {context}"
  example: "三体网络 T3N7 智能调度引擎"


# === 自进化权重 (W31 策略分析自动调整) ===
