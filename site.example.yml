# ============================================================================
# 站点档案【通用模板】—— 换成你自己的站点照这个填
# ============================================================================
# cp site.example.yml site.yml  然后逐项改。
# 全文没有任何「具体站点」的痕迹，代码也不认识任何具体站点。
#
# 换站点三步：
#   1. 改下面的 site / publish / routes
#   2. 改 categories（你的内容分几类、谁负责）
#   3. 改 knowledge/index.yml（你的知识库有哪些条目）
# 代码一行都不用动。
# ============================================================================

site:
  name: 示例科技
  base_url: https://www.example.com
  extra_hosts:                      # 等价域名（含旧域名、备用域名）
    - www.example.com
    - example.com
  brand_aliases:                    # AI 回答里出现哪些词算「提到我」
    - 示例科技
    - Example

publish:
  cms: strapi                       # strapi | none（none = 只生成不发布）
  base_url: https://www.example.com
  token_env: STRAPI_TOKEN           # 环境变量名
  content_type: articles
  category_field: category

routes:
  article_prefix: /blog
  locale_prefixes:
    - ""                            # 默认语言（无前缀）
    # - /en                         # 有多语言就加
  static_paths:
    - /
    - /products
    - /blog
    - /about

categories:                         # 增删随意，代码按配置生成校验规则
  - id: product-news                # ← Strapi enum 里必须存在这个值
    name: 产品动态
    assignee: Alice
    weight: 1.00
    style: 场景化+FAQ块+表格数据
  - id: tech-deep-dive
    name: 技术深度
    assignee: Bob
    weight: 1.20
    style: 论证型+引用来源

batch:
  categories_per_week: 1
  product_slot: false               # 没有"产品篇"就设 false
  product_category: product-news

watermark:
  default: 示例科技 智能引擎          # 通用品类的水印文案
  min_occurrences: 2
  overrides: []                     # 特定知识库用别的文案时才填，例如：
  # overrides:
  #   - when_knowledge: widget-x
  #     text: 示例小部件 WidgetX

quality:
  min_chars: 1500
  min_h2: 4
  min_faq: 4
  min_tables: 2
  require_section_faq: true
  timeliness_phrase: 本文数据更新至
  max_fix_rounds: 3

citation_check:
  engine: doubao                    # doubao | none
  cookie_env: DOUBAO_COOKIE
  timeout_seconds: 900
  queries: []                       # 你的目标客户会怎么问 AI？照这个写：
  # queries:
  #   - {q: "示例科技的产品怎么样", category: product-news}
  #   - {q: "某行业 解决方案 选型", category: tech-deep-dive}

workflow:
  labels:
    seo_monitor: seo-monitor
    geo_check: geo-check
    article_generate: article-generate
    fqa_generate: fqa-generate
    strategy_review: strategy-review

people:
  default_assignee: Alice
  assignees: [Alice, Bob]

thresholds:
  sitemap_coverage_min: 0.90
  lcp_max_seconds: 4.0
  doubaobot_zero_streak_days: 3
  static_pages_expected: 4
