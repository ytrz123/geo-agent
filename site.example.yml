# ============================================================================
# 站点档案【骨架示例】—— 一份虚构站点，只示范结构
# ============================================================================
# 真实档案请放到仓库外，不要提交：
#     mkdir -p ~/.config/geoagent
#     cp site.example.yml ~/.config/geoagent/site.yml
#     $EDITOR ~/.config/geoagent/site.yml      # 换成你自己的站点
#
# 查找顺序：① --site <file.yml> ② GEOAGENT_SITE ③ ./site.yml
#           ④ ~/.config/geoagent/site.yml
#
# site.yml 一次只加载一份 → 一次只服务一个站点。换站点用 --site 指定另一份档案。
# ⚠️ 本文件不含任何凭据，只写环境变量名（token_env / cookie_env / webhook_env）。
# ⚠️ 站点身份（域名、品牌、品类、负责人、水印）属于私有信息 —— 真实的 site.yml 不进仓库。
# ============================================================================

site:
  name: ExampleBrand                            # 人类可读名，出现在日志/工单/通知里
  base_url: https://www.example.com             # 抓取与验证的目标站
  extra_hosts:                                  # 等价域名（多域名/双语站）
    - www.example.com
    - example.org
  brand_aliases:                                # AI 回答里出现这些词算「提到本站品牌」
    - ExampleBrand
    - Example Inc

publish:
  cms: none                                     # strapi | none（none = 只生成不发布）
  base_url: https://www.example.com
  token_env: STRAPI_TOKEN                       # ← 环境变量名，不是值
  content_type: articles                        # Strapi 集合名（/api/<content_type>）
  category_field: category

routes:
  article_prefix: /blog                         # 文章路由前缀（换路由只改这里）
  locale_prefixes:                              # 语言前缀；第一个为默认语言；空串=无前缀
    - ""
    - /en
  static_paths:                                 # 静态页清单（覆盖率分母的扣减项）
    - /
    - /products
    - /blog
    - /about
    - /en
    - /en/products
    - /en/blog
    - /en/about

categories:                                     # 品类 → 负责人 → 权重 → 文体
  - id: industry
    name: 行业观察
    assignee: ExampleEditorA
    weight: 1.50
    style: 论证型+引用来源
  - id: product
    name: 产品应用
    assignee: ExampleEditorB
    weight: 1.00
    style: 场景化+FAQ块+表格数据

batch:
  categories_per_week: 1                        # 每个品类每周几篇
  product_slot: true                            # 是否额外产 1 篇「产品篇」
  product_category: product                     # 产品篇挂哪个品类

watermark:
  default: ExampleBrand Engine                  # 通用品类用这个水印文案
  min_occurrences: 2                            # 正文至少出现几次
  overrides:                                    # 特定知识条目换水印
    - when_knowledge: example-widget
      text: ExampleWidget

quality:
  min_chars: 1500
  min_h2: 4
  min_faq: 4
  min_tables: 2
  require_section_faq: true
  timeliness_phrase: 本文数据更新至
  max_fix_rounds: 3

citation_check:
  engine: none                                  # doubao | none
  cookie_env: EXAMPLE_COOKIE                    # ← 环境变量名（脚本里不硬编码 cookie）
  timeout_seconds: 900
  queries:                                      # 引用检测查询词（品类判定用）
    - {q: "ExampleBrand 产品怎么样", category: product}
    - {q: "ExampleBrand 行业方案选型", category: industry}

workflow:
  labels:                                       # Gitea 工作流标签（按站点命名）
    seo_monitor: seo-monitor
    geo_check: geo-check
    article_generate: article-generate
    fqa_generate: fqa-generate
    strategy_review: strategy-review

people:
  default_assignee: ExampleEditorA
  assignees: [ExampleEditorA, ExampleEditorB]

thresholds:
  sitemap_coverage_min: 0.90
  lcp_max_seconds: 4.0
  doubaobot_zero_streak_days: 3
  static_pages_expected: 8
