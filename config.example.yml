# geo-agent 配置样例 —— 复制成 config.yml 后填值
# config.yml 含凭据，已在 .gitignore 中。容器/仓库里都不要带它。

shadow:
  # 影子期硬开关。true = 禁一切写操作（不 POST/PATCH/PUT、git 不 push）。
  # 只有显式改成 false 且命令行给 --apply 才真的写。
  read_only: true

publish:
  # 🚫 官网发布开关（用户 2026-09-18 明确要求：不要发布到官网）。
  # 默认 false = 代码级拒绝一切 Strapi 写入，即使 shadow.read_only=false + --apply 也不会发。
  # 想重新开启发布，必须同时改这里 + shadow.read_only=false + 命令行 --apply（三重）。
  enabled: false

paths:
  workspace: var/workspaces/geo-seo      # git 工作副本（影子期只读用）
  logs: var/logs                         # JSONL 结构化日志 + trace
  state_db: var/state/geoagent.db        # LangGraph checkpointer（断点续跑）

site:
  base_url: https://www.kamooc.cn
  # i18n 上线后静态页 12 个（首页/products/blog/about × zh+en）。仅作上报字段，不参与覆盖率分母。
  static_pages: 12

gitea:
  base_url: http://192.168.31.162:3000
  repo: stkj/geo-seo
  auth_mode: basic          # basic | token
  user: liujia
  password: admin123
  token: ""                 # auth_mode=token 时使用

strapi:
  base_url: https://www.kamooc.cn
  token: ""                 # 需 Full access；只读影子跑可不填

llm:
  # 走现有 litellm 统一出口；必须是 chat_completions 协议（anthropic 协议打 glm 必 404）
  base_url: https://36.151.148.136/v1
  api_key: ""
  model: glm-5.3-flash-cp
  temperature: 0
  timeout: 120

wecom:
  webhook_url: ""           # 群机器人 key 必须人工创建；留空则 notify 节点只记录不发送
  mention_all_on_alarm: false
  max_chars: 1500
  retry: 3
  connect_timeout: 8

notify:
  # 只推值得推的：新建工单 / P0-P1 / 发布成败 / 塌缩复发
  push_new_issues: true
  push_issue_updates: false        # 老工单日常评论更新默认不推，防刷屏
  push_publish: true
  quiet_hours: ["23:30-07:00"]
  quiet_exempt_alarm: false

thresholds:
  sitemap_coverage_min: 0.90
  lcp_max_seconds: 4.0
  doubaobot_zero_streak_days: 3

quality:
  min_chars: 1500
  min_h2: 4
  min_faq: 4
  min_tables: 2
  max_fix_rounds: 3              # 管道 E 质检回炉上限
