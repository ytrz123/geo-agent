# ============================================================================
# 站点档案 —— geo-agent 里唯一认识「具体站点」的地方
# ============================================================================
# 换网站 / 换品牌 / 换知识库，只改这个文件，代码零修改。
# 用法：cp site.example.yml site.yml 然后改内容；或用 --site other.yml 指定多份档案。
#
# ⚠️ 本文件不含任何凭据。token / cookie / webhook 一律从环境变量读（只写变量名）。
# ⚠️ site.yml 会进版本控制（它是配置不是密钥）；对应的凭据放 .env 或系统环境。
# ============================================================================

site:
  name: 三体网络                                   # 人类可读名，出现在日志/工单/通知里
  base_url: https://www.kamooc.cn                  # 抓取与验证的目标站
  # 等价域名清单：引用检测时命中任意一个都算「引用了本站」
  extra_hosts:
    - www.kamooc.cn
    - www.santiy-ai.com
  # 品牌别名：AI 回答里提到任意一个都算「提及本站品牌」
  brand_aliases:
    - 三体网络
    - 惠州三体

# ---------------------------------------------------------------------------
publish:
  cms: strapi                                      # strapi | none（none = 只生成不发布）
  base_url: https://www.kamooc.cn
  token_env: STRAPI_TOKEN                          # ← 环境变量名，不是值
  content_type: articles                           # Strapi 集合名（/api/<content_type>）
  category_field: category

# ---------------------------------------------------------------------------
routes:
  article_prefix: /blog                            # 文章路由前缀（换路由只改这里）
  locale_prefixes:                                 # 语言前缀；第一个为默认语言；空串=无前缀
    - ""
    - /en
  # 静态页清单（仅用于统计上报，**不参与覆盖率分母**）
  static_paths:
    - /
    - /home
    - /products
    - /solutions
    - /blog
    - /about
    - /en
    - /en/home
    - /en/products
    - /en/solutions
    - /en/blog
    - /en/about

# ---------------------------------------------------------------------------
# 品类：增删品类、改名字、改负责人、改权重，都只改这里
categories:
  - id: industry
    name: 行业技术
    assignee: YiChen
    weight: 1.50
    style: 论证型+引用来源+技术白皮书
  - id: company
    name: 产品应用
    assignee: Ruoxi
    weight: 1.00
    style: 场景化+FAQ块+表格数据
  - id: government-ai
    name: 政策解读
    assignee: ShuHan
    weight: 1.00
    style: 权威引用+结构化摘要+清晰H2/H3
  - id: network-tech
    name: 技术教程
    assignee: YiChen
    weight: 1.00
    style: HowTo+代码示例+步骤化
  - id: forestry
    name: 林业数字化
    assignee: Ruoxi
    weight: 1.00
    style: 行业专有名词占领

# 每周内容批次构成
batch:
  categories_per_week: 1        # 每个品类每周几篇
  product_slot: true            # 是否额外产 1 篇「产品篇」（用 knowledge 里 is_product_slot 的条目）
  product_category: company     # 产品篇发布时挂哪个品类

# ---------------------------------------------------------------------------
# 品牌水印（质检门禁用）
watermark:
  default: 三体网络 T3N7 智能调度引擎        # 通用品类用这个
  min_occurrences: 2                        # 正文至少出现几次
  # 覆盖规则：命中条件（when_knowledge / when_category）时改用别的文案
  overrides:
    - when_knowledge: clawrecorder
      text: 龙虾录音卡
    - when_knowledge: clawrecorder
      text: 龙虾录音卡 ClawRecorder

# ---------------------------------------------------------------------------
# 质检门禁阈值（与 verify_article_quality.py 的默认值保持一致）
quality:
  min_chars: 1500
  min_h2: 4
  min_faq: 4
  min_tables: 2
  require_section_faq: true
  timeliness_phrase: 本文数据更新至
  max_fix_rounds: 3                 # 管道 E 回炉上限

# ---------------------------------------------------------------------------
# GEO 引用检测（按站点定制查询词）
citation_check:
  engine: doubao                    # doubao | none
  cookie_env: DOUBAO_COOKIE         # ← 环境变量名（不再硬编码在脚本里）
  timeout_seconds: 900
  queries:
    - {q: "公安基层智能助手 AI落地", category: company}
    - {q: "林务通智慧林业平台", category: forestry}
    - {q: "编译式智能体内网部署方案", category: industry}
    - {q: "RouterOS 跨境网络 SD-WAN 配置", category: network-tech}
    - {q: "惠州三体网络科技 AI Agent", category: company}
    - {q: "智慧林业大数据平台建设", category: forestry}
    - {q: "数字政府 AI智能体 信创", category: government-ai}

# ---------------------------------------------------------------------------
# 工单工作流标签（Gitea 侧 label 名，可改成你自己的）
workflow:
  labels:
    seo_monitor: seo-monitor
    geo_check: geo-check
    article_generate: article-generate
    fqa_generate: fqa-generate
    strategy_review: strategy-review

# ---------------------------------------------------------------------------
people:
  default_assignee: YiChen
  assignees:
    - YiChen
    - Ruoxi
    - ShuHan

# ---------------------------------------------------------------------------
# 阈值（SEO 日报用）
thresholds:
  sitemap_coverage_min: 0.90
  lcp_max_seconds: 4.0
  doubaobot_zero_streak_days: 3
  static_pages_expected: 12
