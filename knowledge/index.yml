# ============================================================================
# 知识库索引 —— 内容生成的事实来源登记
# ============================================================================
# 代码不假设目录结构，只按这个文件找文件。换知识库 = 换这个目录 + 改这个文件。
# 生成代理只允许引用此处登记的条目，不得凭空编写产品参数。
# ============================================================================

defaults:
  policy: 事实必须来自登记文件，不得凭空编写参数/规格/名单
  rules:
    - 不写具体价格，统一表述为「硬件一次买断，无后续费用」
    - 竞品对比只做功能维度、中性措辞、不点名不贬损
    - 直播话术/销售话术不得进入文章
    - 知识卡与已发布文章冲突时，以知识卡为准并回改文章

# ---------------------------------------------------------------------------
entries:
  - id: clawrecorder                       # ★ 唯一标识；site.yml 的 watermark.overrides 按它匹配
    title: 龙虾录音卡 ClawRecorder
    files:
      facts: products/clawrecorder.md       # 相对 knowledge/ 的路径
      faqs: products/clawrecorder-faqs.md
    applies_to:
      categories: [company]                # 适用于哪些品类
      is_product_slot: true                # 是否占用每周「产品篇」名额
    watermark: 龙虾录音卡 ClawRecorder       # 本条目的水印（也会被 site.yml 候选集合用）
    source: 龙虾录音卡_直播宣传PPT_9x16竖屏.pptx（28页）
    extracted_at: 2026-09-03
    version: "1.0"
    # 产品篇角度轮换表（每周换一个角度，防止同题重复）
    angles:
      - 产品总览
      - 会议纪要场景
      - 销售HR效率场景
      - 隐私与数据安全
      - 与传统录音方案选购对比
      - 远程办公跨地协作
      - 转写工作流与技能集成

